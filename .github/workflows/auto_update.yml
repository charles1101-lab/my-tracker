name: 🚀 매일 차트 자동 생성 로봇

on:
schedule:
- cron: '40 6 * * 1-5'
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: 📂 내 창고 코드 가져오기
    uses: actions/checkout@v3

  - name: 🐍 파이썬 환경 세팅
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: 🔤 한글 폰트 설치
    run: |
      sudo apt-get update
      sudo apt-get install -y fonts-nanum

  - name: 📦 파이썬 부품 설치
    run: |
      pip install -r requirements.txt

  - name: ⚙️ 차트 공장 가동
    run: |
      python chart_maker.py

  - name: 💾 결과물 저장
    run: |
      git config --global user.name 'github-actions[bot]'
      git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      git add .
      git commit -m "📈 자동 업데이트" || echo "변경된 내용이 없습니다."
      git push
